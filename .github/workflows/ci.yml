name: Java CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      coverage:
        description: Genera il report JaCoCo
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: java-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e test Java
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.coverage) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Il checkout di una PR usa il merge di prova. Serve anche il suo genitore base.
          fetch-depth: 2
          persist-credentials: false

      - name: Riconosci le PR di sola documentazione
        id: docs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          changed_files="$(mktemp)"
          trap 'rm -f "$changed_files"' EXIT
          if [[ "$(git rev-parse --verify HEAD^1)" != "$BASE_SHA" ]] ||
             ! git diff --no-renames --name-only -z "$BASE_SHA" HEAD -- > "$changed_files"; then
            echo "::warning::Diff della PR non disponibile. Eseguo la suite Java completa."
            exit 0
          fi
          [[ -s "$changed_files" ]] || exit 0
          while IFS= read -r -d '' file; do
            case "$file" in
              README.md|docs/*.md|docs/*.pdf|.github/*.md) ;;
              *) exit 0 ;;
            esac
          done < "$changed_files"
          echo "only=true" >> "$GITHUB_OUTPUT"
          echo "Build e test Java saltati: la PR modifica soltanto documentazione." >> "$GITHUB_STEP_SUMMARY"

      - name: Verifica presenza del progetto Maven
        id: project
        if: steps.docs.outputs.only != 'true'
        shell: bash
        run: |
          if [[ ! -f pom.xml ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Progetto Maven non ancora presente: build e test NON eseguiti." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for file in mvnw mvnw.cmd .mvn/wrapper/maven-wrapper.properties; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Progetto Maven incompleto: manca $file"
              exit 1
            fi
          done
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Configura Java 25
        if: steps.project.outputs.present == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build e test con Maven Wrapper
        id: maven
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          args=(--batch-mode --no-transfer-progress)
          if [[ "$COVERAGE" == 'true' ]]; then
            args+=(-Pcoverage)
          fi
          bash ./mvnw "${args[@]}" verify

      - name: Applica il tema PICUS al report di copertura
        if: env.COVERAGE == 'true' && steps.maven.outcome == 'success'
        run: python3 scripts/applica_tema_jacoco.py target/site/jacoco

      - name: Carica il report di copertura Java
        if: env.COVERAGE == 'true' && steps.maven.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copertura-java
          path: target/site/jacoco/
          if-no-files-found: error

      - name: Riepiloga i test Java falliti
        if: failure() && steps.maven.outcome == 'failure'
        run: python3 scripts/riassumi_test_java.py >> "$GITHUB_STEP_SUMMARY"
