name: Controllo Javadoc

on:
  pull_request:
    paths:
      - 'src/main/java/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'scripts/javadoc*.args'
      - 'scripts/verifica_javadoc.sh'
      - '.github/workflows/javadoc*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: javadoc-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Javadoc delle API pubbliche
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configura Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verifica il Javadoc
        shell: bash
        run: bash scripts/verifica_javadoc.sh "$RUNNER_TEMP/javadoc-classpath.txt" "$RUNNER_TEMP/javadoc-api-check"
