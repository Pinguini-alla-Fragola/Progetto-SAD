# Calcola il burndown dello sprint in corso e lo pubblica sul branch burndown-data.
#
# Da impostare in Settings -> Secrets and variables -> Actions:
#  - secret PROJECT_TOKEN: token personale classico (scope project e repo) per leggere il project.
#    La scadenza va messa oltre il 17/12/2026, altrimenti il workflow si ferma
#  - variabile PROJECT_NUMBER: numero del project, lo trovi nell'URL .../projects/<numero>
#  - PROJECT_OWNER e OWNER_TYPE (facoltative): di default il project è di Pinguini-alla-Fragola
#
# Output su burndown-data: burndown-latest.svg (sprint in corso, lo legge il README)
# e svg/csv di ogni sprint. Ogni esecuzione salva anche l'artefatto «burndown».
name: burndown

on:
  schedule:
    - cron: "50 23 * * *"       # 23:50 UTC, ma GitHub lo avvia con ore di ritardo
  workflow_dispatch:
    inputs:
      iteration_title:
        description: "Titolo dell'iterazione (vuoto = quella in corso). Es. 'S1 - Preparazione'"
        type: string
        required: false
        default: ""

permissions:
  contents: write                # serve per il push su burndown-data

concurrency:
  group: burndown                # una esecuzione alla volta
  cancel-in-progress: false

jobs:
  burndown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifica esclusione di Epic e Pull Request
        run: python -m unittest discover -s scripts -p 'test_burndown.py'

      - name: Calcola il burndown
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER || 'Pinguini-alla-Fragola' }}   # chi possiede il project
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          OWNER_TYPE: ${{ vars.OWNER_TYPE || 'organization' }}                  # organization o user
          ITERATION_TITLE: ${{ github.event.inputs.iteration_title }}
          ITERATION_FIELD: Iteration
          STATUS_FIELD: Status
          DONE_VALUE: Done
          POINTS_FIELD: Estimate   # campo Number; se manca si usa Size (XS1 S2 M3 L5 XL8), poi 1
          SIZE_FIELD: Size
          OUT_DIR: ${{ runner.temp }}/out
        run: python scripts/burndown.py

      - name: Conserva come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: burndown
          path: ${{ runner.temp }}/out

      # main è protetto, quindi push su un branch a parte
      - name: Pubblica sul branch burndown-data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin burndown-data >/dev/null; then
            git fetch origin burndown-data
            git checkout -B burndown-data origin/burndown-data
          else
            git checkout --orphan burndown-data
            git rm -rf . >/dev/null
          fi
          cp "$RUNNER_TEMP"/out/* .
          git add -A
          git commit -m "chore: aggiorna burndown" || echo "nessuna modifica"
          git push origin burndown-data
