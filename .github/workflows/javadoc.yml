name: Pubblica Javadoc

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: javadoc-publication
  cancel-in-progress: false

jobs:
  build:
    name: Genera e aggiorna il branch Javadoc
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout di main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Configura Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Risolvi il classpath Java
        shell: bash
        run: |
          bash ./mvnw --batch-mode --no-transfer-progress dependency:build-classpath \
            -DincludeScope=compile -Dmdep.outputFile="$RUNNER_TEMP/javadoc-classpath.txt"

      - name: Genera Javadoc
        shell: bash
        run: |
          classpath="$(cat "$RUNNER_TEMP/javadoc-classpath.txt")"
          javadoc -quiet -classpath "$classpath" -d "$RUNNER_TEMP/javadoc-api-check" '@scripts/javadoc-api.args'
          javadoc -classpath "$classpath" -d "$RUNNER_TEMP/javadoc-site" '@scripts/javadoc.args'
          test -s "$RUNNER_TEMP/javadoc-site/index.html"
          cp docs/architecture/picus-logo.svg "$RUNNER_TEMP/javadoc-site/resource-files/picus-logo.svg"

      - name: Aggiorna il branch javadoc
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git_auth() {
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' "$@"
          }

          # Prepara l'intera nuova versione in un repository temporaneo.
          archive="$RUNNER_TEMP/javadoc-branch"
          git init --initial-branch=javadoc "$archive"
          cd "$archive"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

          existing_branch="$(git_auth ls-remote origin refs/heads/javadoc)"
          if [[ -n "$existing_branch" ]]; then
            git_auth fetch --no-tags --depth=1 origin refs/heads/javadoc
            git update-ref refs/heads/javadoc FETCH_HEAD
          fi

          cp -a "$RUNNER_TEMP/javadoc-site/." .
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi

          source_commit="$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "docs(javadoc): aggiorna la documentazione Java da $source_commit"
          git_auth push origin HEAD:refs/heads/javadoc

      - name: Carica l'artefatto per GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/javadoc-site

  deploy:
    name: Pubblica su GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Javadoc
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
