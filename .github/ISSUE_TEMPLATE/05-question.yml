name: Question
description: Chiarimento al committente con fonte, impatto e risposta tracciata.
title: "[QUESTION] "
type: Question
body:
  - type: markdown
    attributes:
      value: |
        Verificare prima se la fonte o una risposta già registrata risolve il dubbio.
        Le scelte stilistiche, architetturali e sui pattern spettano al team:
        discuterle negli artefatti tecnici, senza presentarle come requisiti funzionali.
  - type: textarea
    id: question
    attributes:
      label: Domanda
      description: Un dubbio specifico, formulato in modo comprensibile al committente.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Fonte e contesto
      description: Documento e pagina o artefatto; indicare cosa è già noto e cosa manca.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Perché serve la risposta
      description: Decisioni, Story, criteri o scenari di qualità interessati.
    validations:
      required: true
  - type: textarea
    id: assumption
    attributes:
      label: Ipotesi provvisoria
      description: Come si procede in attesa della risposta, oppure indicare che non si può assumere una soluzione.
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: Risposta ed esito
      description: Da aggiornare dopo il confronto con data, evidenza della risposta e artefatti modificati.
    validations:
      required: false
