name: Bug
description: Difetto riproducibile nel codice, nella configurazione o negli artefatti.
title: "[BUG] "
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Per vulnerabilità o credenziali esposte seguire la Security policy,
        senza descriverle in un'issue pubblica. Usare dati sintetici e rimuovere
        dati personali da log e immagini. Cercare prima eventuali duplicati.
  - type: textarea
    id: observed
    attributes:
      label: Risultato osservato
      description: Descrivere il difetto e il suo impatto.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Risultato atteso e riferimento
      description: Collegare criterio di accettazione, requisito o artefatto corretto.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passaggi per riprodurre
      description: Caso minimo, precondizioni e dati sintetici necessari.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Versione e ambiente
      description: Commit o versione del documento e strumenti pertinenti; non allegare file .env.
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Verifica della correzione
      description: Test di regressione per il codice o verifica dell'artefatto per difetti documentali.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidenze aggiuntive
      description: Solo log o immagini ripuliti; eventuali dipendenze o casi correlati.
    validations:
      required: false
