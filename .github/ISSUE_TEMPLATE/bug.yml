name: Bug
description: Report an observable deviation from expected behaviour.
title: "[BUG] "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: Describe what happens and include the exact error when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Include version, configuration, logs or screenshots without sensitive data.
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocking
        - High
        - Medium
        - Low
    validations:
      required: true
