name: Task
description: Attività concreta di analisi, documentazione, sviluppo o verifica.
title: "[TASK] "
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Le attività S1-01...S1-10 sono Task preparatorie. Non implicano che
        una funzionalità sia implementata. Assegnatari e sprint si concordano
        nel planning; non occorre assegnare automaticamente tutto il team.
  - type: textarea
    id: goal
    attributes:
      label: Obiettivo
      description: Problema da affrontare e risultato utile al progetto.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Collegamenti e fonti
      description: Codice S1 o ID, Story/Epic, documento e pagina o artefatto interessato.
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Output atteso
      description: Documento, diagramma, analisi, configurazione o comportamento da consegnare.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criteri di completamento e verifica
      description: Evidenze osservabili, controlli pertinenti e revisione del risultato.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dipendenze, ipotesi e impedimenti
      description: Collegare gli elementi necessari oppure indicare Nessuno; usare blocked solo con una motivazione.
    validations:
      required: true
