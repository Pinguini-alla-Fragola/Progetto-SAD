# Reference list. Create these labels in every generated repository or automate
# their creation through the GitHub API/CLI.
- name: "type: epic"
  color: "5319E7"
  description: "Large functional objective decomposed into User Stories"
- name: "type: user-story"
  color: "1D76DB"
  description: "Functionality that provides value to a stakeholder"
- name: "type: bug"
  color: "D73A4A"
  description: "Observed deviation from expected behaviour"
- name: "type: technical-task"
  color: "6F42C1"
  description: "Implementation, testing, refactoring or tooling work"
- name: "type: architecture"
  color: "0052CC"
  description: "Architecturally significant work or decision"
- name: "type: quality"
  color: "0E8A16"
  description: "Quality scenario or validation activity"
- name: "type: spike"
  color: "FBCA04"
  description: "Time-boxed investigation"
- name: "priority: high"
  color: "B60205"
  description: "High-priority item"
- name: "priority: medium"
  color: "D93F0B"
  description: "Medium-priority item"
- name: "priority: low"
  color: "C2E0C6"
  description: "Low-priority item"
