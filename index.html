<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PICUS</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: clamp(1rem, 4vw, 3rem);
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(2rem, 5vw, 6.5rem);
            width: min(100%, 1360px);
        }

        .logo-wrapper {
            flex: 0 1 auto;
        }

        .logo-wrapper img {
            display: block;
            width: clamp(270px, 29vw, 480px);
            height: auto;
            max-height: 68vh;
            object-fit: contain;
        }

        .content {
            display: grid;
            flex: 1 1 0;
            min-width: 0;
            max-width: 790px;
            gap: clamp(1.35rem, 2.6vw, 2.25rem);
        }

        h1 {
            margin: 0;
            font-size: clamp(2.35rem, 4vw, 4.2rem);
            font-weight: 800;
            line-height: 1.12;
            letter-spacing: -0.035em;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
        }

        a:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 4px;
        }

        .resources-intro {
            margin: 0 0 0.35rem;
            color: var(--text-secondary);
            font-size: clamp(1rem, 1.8vw, 1.35rem);
            line-height: 1.5;
        }

        .resources {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem 1.25rem;
        }

        .resource-link {
            padding: 0.55rem 0.15rem 3px;
            border-bottom: 3px solid var(--accent-color);
            color: var(--text-primary);
            font-size: clamp(1.125rem, 1.8vw, 1.5rem);
            font-weight: 600;
        }

        .resource-link:hover {
            color: var(--accent-color);
        }

        .reviews h2 {
            margin: 0 0 0.75rem;
            font-size: 1.17rem;
            font-weight: 600;
        }

        .review-list {
            display: grid;
            gap: 0.55rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .review {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.35rem 1rem;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            background-color: var(--surface-color);
            line-height: 1.45;
        }

        .review--available:hover {
            border-color: var(--accent-color);
        }

        .review--pending {
            color: var(--text-secondary);
        }

        .review-title {
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 1.75rem;
                padding-block: 0.5rem;
            }

            .logo-wrapper img {
                width: 100%;
                max-width: 250px;
                max-height: none;
            }

            .content {
                width: min(100%, 560px);
            }

            h1 {
                justify-self: center;
                max-width: calc(100vw - 4rem);
                font-size: clamp(2rem, 4vw, 3.5rem);
                line-height: 1.15;
                letter-spacing: -0.02em;
                text-align: center;
            }

            .resources-intro {
                text-align: center;
            }

            .resources {
                justify-content: center;
            }

            .resource-link {
                border-bottom-width: 2px;
                padding-bottom: 2px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="logo-wrapper">
            <img src="pinguino-costruzione.webp" alt="Il pinguino di PICUS al lavoro">
        </div>
        <div class="content">
            <h1 lang="en">Hold on, we're almost ready to shine.</h1>

            <div>
                <p class="resources-intro" lang="en">While you wait, take a look at our</p>
                <nav class="resources" aria-label="Risorse PICUS">
                    <a class="resource-link" href="https://javadocs.strawberrypenguin.it/">
                        Javadoc PICUS <span aria-hidden="true">↗</span>
                    </a>
                    <a class="resource-link" href="https://github.com/Pinguini-alla-Fragola/Progetto-SAD" target="_blank" rel="noopener noreferrer">
                        GitHub <span aria-hidden="true">↗</span>
                    </a>
                </nav>
            </div>

            <section class="reviews" aria-labelledby="reviews-title">
                <h2 id="reviews-title">Sprint Review</h2>
                <ul class="review-list">
                    <li>
                        <a class="review review--available" href="review/index.html">
                            <time class="review-title" datetime="2026-11-05">5 novembre 2026</time>
                            <span aria-hidden="true">→</span>
                        </a>
                    </li>
                    <li>
                        <div class="review review--pending">
                            <time class="review-title" datetime="2026-11-19">19 novembre 2026</time>
                        </div>
                    </li>
                    <li>
                        <div class="review review--pending">
                            <time class="review-title" datetime="2026-12-03">3 dicembre 2026</time>
                        </div>
                    </li>
                    <li>
                        <div class="review review--pending">
                            <time class="review-title" datetime="2026-12-17">17 dicembre 2026</time>
                        </div>
                    </li>
                </ul>
            </section>
        </div>
    </main>
</body>
</html>
