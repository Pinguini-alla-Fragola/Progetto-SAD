services:
  picus-db:
    image: postgres:17
    environment:
      POSTGRES_DB: picus
      POSTGRES_USER: picus
      POSTGRES_PASSWORD: "${PICUS_DB_PASSWORD:?Imposta PICUS_DB_PASSWORD nel file .env}"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "picus", "-d", "picus"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - picus-dati:/var/lib/postgresql/data

  picus-webapp:
    build: .
    depends_on:
      picus-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      PICUS_DB_URL: jdbc:postgresql://picus-db:5432/picus
      PICUS_DB_PASSWORD: "${PICUS_DB_PASSWORD:?Imposta PICUS_DB_PASSWORD nel file .env}"
      PICUS_DEMO_PASSWORD: "${PICUS_DEMO_PASSWORD:?Imposta PICUS_DEMO_PASSWORD nel file .env}"
      # Variabili email opzionali: se PICUS_MAIL_HOST è vuoto in demo rimane attivo InvioEmailLogAdapter
      PICUS_MAIL_HOST: "${PICUS_MAIL_HOST:-}"
      PICUS_MAIL_PORT: "${PICUS_MAIL_PORT:-587}"
      PICUS_MAIL_USERNAME: "${PICUS_MAIL_USERNAME:-}"
      PICUS_MAIL_PASSWORD: "${PICUS_MAIL_PASSWORD:-}"
      PICUS_MAIL_FROM: "${PICUS_MAIL_FROM:-noreply@strawberrypenguin.it}"
      PICUS_APP_BASE_URL: "${PICUS_APP_BASE_URL:-http://localhost:8080}"

volumes:
  picus-dati: