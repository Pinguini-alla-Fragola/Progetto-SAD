services:
  picus-webapp:
    depends_on:
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: demo,mailpit
      PICUS_APP_BASE_URL: http://localhost:8080
      # Il profilo Compose è accessibile solo da localhost via HTTP.
      PICUS_COOKIE_SECURE: "false"

  mailpit:
    image: axllent/mailpit:v1.34.0
    profiles: [mailpit]
    ports:
      - "127.0.0.1:8025:8025"
