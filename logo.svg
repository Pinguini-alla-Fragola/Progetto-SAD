<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Pinguino e fragola</title>
  <desc id="desc">Logo vettoriale: un pinguino seduto abbraccia una fragola grande quasi quanto lui. Sfondo trasparente, contorni blu notte, zampe arancioni e foglie verdi.</desc>
  <g stroke="#182C39" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
