    <!-- Maschera a cuore e petto. -->
    <path fill="#FFF9EF" stroke="none" d="M512 266C470 206 386 208 347 266C311 319 321 380 344 433C357 463 340 498 326 544C294 649 327 750 402 799C455 833 569 833 622 799C697 750 730 649 698 544C684 498 667 463 680 433C703 380 713 319 677 266C638 208 554 206 512 266Z"/>
