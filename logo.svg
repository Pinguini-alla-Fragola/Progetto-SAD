    </g>
    <path fill="#F9AD49" stroke-width="12" d="M480 367Q512 352 544 367Q537 391 512 401Q487 391 480 367Z"/>
    <!-- Une fraise généreuse, à l'échelle du corps. -->
    <path fill="#F04F59" d="M512 456C462 425 393 428 342 453C285 481 266 536 283 607C306 705 387 819 473 877C499 895 525 895 551 877C637 819 718 705 741 607C758 536 739 481 682 453C631 428 562 425 512 456Z"/>
