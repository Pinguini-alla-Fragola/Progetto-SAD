    <g fill="#FFE8AF" stroke="none">
      <ellipse cx="396" cy="552" rx="9" ry="16" transform="rotate(-22 396 552)"/>
      <ellipse cx="512" cy="590" rx="9" ry="16"/>
      <ellipse cx="628" cy="552" rx="9" ry="16" transform="rotate(22 628 552)"/>
      <ellipse cx="367" cy="644" rx="9" ry="16" transform="rotate(-25 367 644)"/>
