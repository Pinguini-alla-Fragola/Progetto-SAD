<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PICUS – Video della demo</title>
    <meta name="description" content="Video della demo di PICUS per la Sprint Review del 19 novembre, con o senza commento vocale.">
    <link rel="icon" type="image/svg+xml" href="../logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
        }

        * { box-sizing: border-box; }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: clamp(1rem, 4vw, 3rem);
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        main { width: min(100%, 960px); }

        .back {
            display: inline-block;
            margin-bottom: 1.25rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
        }
        .back:hover, .back:focus-visible { color: var(--accent-color); }

        h1 { margin: 0 0 0.4rem; font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; }
        .lead { margin: 0 0 1.75rem; color: var(--text-secondary); line-height: 1.5; }

        .player { margin-top: 1.5rem; }

        .toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 1rem;
            padding: 0.8rem 1.25rem;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            background-color: var(--surface-color);
            color: var(--text-primary);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        .toggle:hover, .toggle:focus-visible { border-color: var(--accent-color); outline: none; }
        .toggle:disabled { opacity: 0.6; cursor: progress; }
        .toggle svg { width: 1.2rem; height: 1.2rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            background: #000;
        }

        @media (max-width: 560px) {
            .toggle { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <main>
        <a class="back" href="../index.html">← Torna alla pagina iniziale</a>
        <h1>Video della demo</h1>
        <p class="lead">Sprint Review del 19 novembre 2026.</p>

        <section class="player">
            <video id="video" controls controlslist="nodownload" playsinline preload="metadata"></video>
            <button type="button" class="toggle" id="toggle" aria-live="polite">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
                <span id="toggle-label">Senza voce</span>
            </button>
        </section>
    </main>

    <script>
        (function () {
            // i video stanno nel branch landing-video, per non appesantire il sito
            var BASE = 'https://raw.githubusercontent.com/Pinguini-alla-Fragola/Progetto-SAD/landing-video/';
            var files = {
                'voce': BASE + 'picus-demo.mp4',
                'senza-voce': BASE + 'picus-demo-senza-voce.mp4'
            };
            var video = document.getElementById('video');
            var toggle = document.getElementById('toggle');
            var label = document.getElementById('toggle-label');
            var current = location.hash === '#senza-voce' ? 'senza-voce' : 'voce';

            // il pulsante propone l'altra versione
            function renderButton() {
                label.textContent = current === 'voce' ? 'Senza voce' : 'Con voce';
                toggle.setAttribute('aria-label', current === 'voce'
                    ? 'Passa alla versione senza voce' : 'Passa alla versione con voce');
            }

            // le due versioni hanno la stessa durata: si riparte dallo stesso istante
            function swap() {
                var next = current === 'voce' ? 'senza-voce' : 'voce';
                var time = video.currentTime || 0;
                var wasPlaying = !video.paused && !video.ended;
                toggle.disabled = true;
                video.addEventListener('loadedmetadata', function onReady() {
                    video.removeEventListener('loadedmetadata', onReady);
                    video.currentTime = time;
                    toggle.disabled = false;
                    if (wasPlaying) {
                        var p = video.play();
                        if (p && p.catch) p.catch(function () {});
                    }
                });
                video.addEventListener('error', function onError() {
                    video.removeEventListener('error', onError);
                    toggle.disabled = false;
                });
                current = next;
                video.src = files[current];
                video.load();
                renderButton();
                try { history.replaceState(null, '', '#' + current); } catch (e) { /* ignorato */ }
            }

            // niente menu del tasto destro sul video (meno scorciatoie per scaricarlo)
            video.addEventListener('contextmenu', function (e) { e.preventDefault(); });
            toggle.addEventListener('click', swap);

            video.src = files[current];
            renderButton();
        })();
    </script>
</body>
</html>
