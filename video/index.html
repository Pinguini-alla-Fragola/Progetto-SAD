<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PICUS – Video della demo</title>
    <meta name="description" content="Video della demo di PICUS per la Sprint Review del 19 novembre, con o senza commento vocale.">
    <link rel="icon" type="image/svg+xml" href="../logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
        }

        * { box-sizing: border-box; }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: clamp(1rem, 4vw, 3rem);
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        main { width: min(100%, 960px); }

        .back {
            display: inline-block;
            margin-bottom: 1.25rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
        }
        .back:hover, .back:focus-visible { color: var(--accent-color); }

        h1 { margin: 0 0 0.4rem; font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; }
        .lead { margin: 0 0 1.75rem; color: var(--text-secondary); line-height: 1.5; }

        .player { margin-top: 1.5rem; }

        .versions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1rem;
        }

        .version {
            padding: 0.8rem 1.25rem;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            background-color: var(--surface-color);
            color: var(--text-primary);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        .version:hover, .version:focus-visible { border-color: var(--accent-color); outline: none; }
        .version[aria-checked="true"] {
            border-color: var(--accent-color);
            background-color: rgba(88, 166, 255, 0.14);
            color: var(--accent-color);
            cursor: default;
        }
        .version:disabled { opacity: 0.6; cursor: progress; }

        video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            background: #000;
        }

        @media (max-width: 560px) {
            .versions { display: grid; grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <main>
        <a class="back" href="../index.html">← Torna alla pagina iniziale</a>
        <h1>Video della demo</h1>
        <p class="lead">Sprint Review del 19 novembre 2026.</p>

        <section class="player">
            <video id="video" controls controlslist="nodownload" playsinline preload="metadata"></video>
            <div class="versions" role="radiogroup" aria-label="Versione del video">
                <button type="button" class="version" role="radio" aria-checked="true" data-version="italiano" lang="it">Italiano</button>
                <button type="button" class="version" role="radio" aria-checked="false" data-version="en" lang="en">English</button>
                <button type="button" class="version" role="radio" aria-checked="false" data-version="napoletano" lang="nap">Napoletano</button>
                <button type="button" class="version" role="radio" aria-checked="false" data-version="senza-voce">Senza voce</button>
            </div>
        </section>
    </main>

    <script>
        (function () {
            // i video stanno nel branch landing-video, per non appesantire il sito
            var BASE = 'https://raw.githubusercontent.com/Pinguini-alla-Fragola/Progetto-SAD/landing-video/';
            var files = {
                'italiano': BASE + 'picus-demo-voce-reale.mp4',
                'en': BASE + 'picus-demo-en.mp4',
                'napoletano': BASE + 'picus-demo-napoletano.mp4',
                'senza-voce': BASE + 'picus-demo-senza-voce.mp4'
            };
            // i vecchi indirizzi con #voce aprono la versione in italiano
            var alias = { 'voce': 'italiano' };
            var video = document.getElementById('video');
            var buttons = Array.prototype.slice.call(document.querySelectorAll('.version'));
            var hash = location.hash.replace('#', '');
            var current = files[alias[hash] || hash] ? (alias[hash] || hash) : 'italiano';

            function renderButtons() {
                buttons.forEach(function (b) {
                    b.setAttribute('aria-checked', String(b.getAttribute('data-version') === current));
                });
            }

            function setDisabled(value) {
                buttons.forEach(function (b) { b.disabled = value; });
            }

            // tutte le versioni hanno la stessa durata: si riparte dallo stesso istante
            function choose(next) {
                if (next === current) return;
                var time = video.currentTime || 0;
                var wasPlaying = !video.paused && !video.ended;
                setDisabled(true);
                video.addEventListener('loadedmetadata', function onReady() {
                    video.removeEventListener('loadedmetadata', onReady);
                    video.currentTime = time;
                    setDisabled(false);
                    if (wasPlaying) {
                        var p = video.play();
                        if (p && p.catch) p.catch(function () {});
                    }
                });
                video.addEventListener('error', function onError() {
                    video.removeEventListener('error', onError);
                    setDisabled(false);
                });
                current = next;
                video.src = files[current];
                video.load();
                renderButtons();
                try { history.replaceState(null, '', '#' + current); } catch (e) { /* ignorato */ }
            }

            // niente menu del tasto destro sul video (meno scorciatoie per scaricarlo)
            video.addEventListener('contextmenu', function (e) { e.preventDefault(); });
            buttons.forEach(function (b) {
                b.addEventListener('click', function () { choose(b.getAttribute('data-version')); });
            });

            video.src = files[current];
            renderButtons();
        })();
    </script>
</body>
</html>
