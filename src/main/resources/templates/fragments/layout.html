<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<body>
<a th:fragment="skip" class="skip-link" href="#contenuto">Vai al contenuto</a>

<a th:fragment="brand" class="picus-logo" href="/" aria-label="PICUS, area di lavoro">
    <img src="/img/picus.svg" width="36" height="36" alt="">
    <span>PICUS</span>
</a>

<header th:fragment="workspaceHeader(ruolo)" class="picus-navbar workspace-navbar">
    <div class="nav-inner">
        <div class="workspace-identity">
            <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-controls="workspace-sidebar"
                    aria-expanded="true" aria-label="Chiudi menu di navigazione">
                <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#menu"></use></svg>
            </button>
            <a th:replace="~{fragments/layout :: brand}" href="/">PICUS</a>
            <span class="workspace-role" th:text="${ruolo}"></span>
        </div>
        <div class="workspace-account">
            <span class="workspace-user" th:text="${nomeAccount}"></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-secondary btn-sm" type="submit">
                    <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#logout"></use></svg><span>Esci</span>
                </button>
            </form>
        </div>
    </div>
</header>

<footer th:fragment="footer" class="picus-footer">
    <div class="footer-inner">
        <p><strong>PICUS</strong></p>
        <a href="https://strawberrypenguin.it" target="_blank" rel="noopener noreferrer">
            <img src="/img/strawberry-penguin.svg" class="team-logo" width="40" height="40" alt="">
            <span>Designed by <strong>PinguiniAllaFragola</strong></span>
            <span class="sr-only"> (si apre in una nuova scheda)</span>
        </a>
    </div>
</footer>
</body>
</html>
