<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Errore · PICUS</title>
    <link rel="stylesheet" th:href="@{/css/picus.css}">
</head>
<body>
<main class="center">
    <div class="error-card">
        <img class="error-penguin" th:src="@{/img/pinguino-errore.png}" alt="" aria-hidden="true">
        <p class="code" th:text="${status}">404</p>
        <p class="eyebrow">Richiesta non completata</p>
        <h1 th:text="${status == 403} ? 'Accesso non consentito' : (${status == 404} ? 'La pagina che stavi cercando sembra essere andata persa tra i ghiacchi' : 'Qualcosa è andato storto')">Errore</h1>
        <p class="lead" th:text="${status == 403} ? 'Il tuo ruolo non può aprire questa pagina.' : 'Torna alla pagina iniziale e riprova.'">Torna indietro.</p>
        <a class="btn btn-ghost" th:href="@{/}">Torna alla home</a>
    </div>
</main>
</body>
</html>
