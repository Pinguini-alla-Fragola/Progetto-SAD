spring:
  application:
    name: picus
  datasource:
    url: "${PICUS_DB_URL:jdbc:postgresql://localhost:5432/picus}"
    username: "${PICUS_DB_USER:picus}"
    password: "${PICUS_DB_PASSWORD:}"
  flyway:
    locations: classpath:db/migration,classpath:db/{vendor}
  servlet:
    multipart:
      # Allegati delle comunicazioni (#141): 5 file da 5 MB al massimo, più i campi del modulo.
      max-file-size: 5MB
      max-request-size: 26MB
      # Lettura al momento dell'uso: un file troppo grande diventa un errore sul campo, non una pagina di errore.
      resolve-lazily: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: "${PICUS_MAIL_HOST:}"
    port: "${PICUS_MAIL_PORT:587}"
    username: "${PICUS_MAIL_USERNAME:}"
    password: "${PICUS_MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

server:
  tomcat:
    # Il modulo delle comunicazioni (#141) ha una parte con i campi più una per file (al massimo 5): con 10 un file
    # in più riceve ancora il messaggio sul numero di allegati, e nessuna richiesta può arrivare con centinaia di parti.
    max-part-count: 10
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        # false solo per sviluppo locale in http (PICUS_COOKIE_SECURE=false)
        secure: "${PICUS_COOKIE_SECURE:true}"
        same-site: lax

picus:
  utenze:
    attivazione:
      # Validità del link monouso di attivazione di OPT e Operatori (regole degli accessi: 72 ore).
      validita: PT72H
  app:
    base-url: "${PICUS_APP_BASE_URL:http://localhost:8080}"
  mail:
    from: "${PICUS_MAIL_FROM:noreply@strawberrypenguin.it}"